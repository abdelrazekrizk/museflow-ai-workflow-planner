[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "museflow"
version = "0.1.0"
description = "MuseFlow: AI Workflow Planner using Meta Muse Spark 1.3"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "MuseFlow Team", email = "team@museflow.dev"}
]
keywords = ["ai", "workflow", "planning", "meta-model-api", "muse-spark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
    "flake8>=7.5.0",
    "black>=26.10.1",
    "mypy>=2.4.1",
    "ipython>=9.18.1",
]
testing = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
]

[project.urls]
Homepage = "https://github.com/abdelrazekrizk/museflow-ai-workflow-planner"
Repository = "https://github.com/abdelrazekrizk/museflow-ai-workflow-planner"
Issues = "https://github.com/abdelrazekrizk/museflow-ai-workflow-planner/issues"

[tool.setuptools]
packages = ["museflow"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
museflow = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
extraPaths = ["src"]